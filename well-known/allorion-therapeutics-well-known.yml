note: >-
  No /.well-known/ discovery document is published on alloriontx.com. Two statuses are recorded per
  path because the origin (SiteGround, nginx) answers automated requests from our egress with an
  HTTP 202 CAPTCHA interstitial — an HTML body whose only content is a meta-refresh to
  /.well-known/sgcaptcha/ — rather than the real response. `status` is the code our probe actually
  received; `resolved` is what the path really returns once served, checked through a public reader
  service rather than by defeating the challenge, which this pipeline does not do. Where `resolved`
  is null the challenge also stood in front of the reader and the true status was not observed; it
  is recorded as unknown rather than guessed. Every path that did resolve returned the site's
  WordPress 404 page. There is no security.txt, no OIDC or OAuth metadata, no api-catalog, no
  ai-plugin.json and no A2A agent card at either the canonical or the legacy path.
