description: 'Allorion Therapeutics is a clinical-stage biopharmaceutical company founded in 2020
  by Qiang Ding and Fang Li, developing novel small-molecule therapies for cancer and autoimmune
  disease. Operating from Natick, Massachusetts and Guangzhou, China, Allorion applies mutant-selective
  and isoform-specific medicinal chemistry across a pipeline that includes ARTS-011 (a TYK2 inhibitor),
  ARTS-021 (a CDK2 inhibitor targeting CCNE1-amplified tumors), and ARTS-023/AVZO-023 partnered with
  Avenzo Therapeutics, alongside an exclusive option and global license agreement with AstraZeneca for
  an allosteric EGFR L858R inhibitor. The company is a drug-discovery organization backed by Qiming
  Venture Partners and INCE Capital; it markets internal data and high-throughput screening platforms
  but publishes no public developer program, API, SDK, or machine-readable specification.'
